<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Playtime Co. · Fábrica de Mates</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --acc:#19a7ff;--yl:#ffd23f;--gr:#2dff7a;--pk:#ff3fa4;--pu:#b34bff;--tx:#eaf6ff;
  color-scheme:dark;box-sizing:border-box;
  --safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);
  --safe-left:env(safe-area-inset-left,0px);--safe-right:env(safe-area-inset-right,0px)
}
html{scroll-padding-top:var(--safe-top);height:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{
  margin:0;min-height:100%;font-family:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
  color:var(--tx);background:linear-gradient(#050a1cd0,#050a1cf2),center/cover fixed #050a1c;
  overflow-x:hidden;touch-action:manipulation
}
header{
  position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:8px;
  padding:calc(6px + var(--safe-top)) calc(10px + var(--safe-right)) 6px calc(10px + var(--safe-left));
  background:#050a1cee;backdrop-filter:blur(8px);border-bottom:2px solid #16306b
}
#bk{
  width:40px;height:40px;border-radius:50%;border:3px solid var(--acc);background:#0a1a44;
  color:#fff;font-size:1.3rem;box-shadow:0 0 10px var(--acc);display:grid;place-items:center;
  padding:0;cursor:pointer;flex-shrink:0
}
#bk[hidden]{display:none}
.pill{
  display:flex;align-items:center;gap:6px;background:#071030;border:2.5px solid #2a6cff;
  border-radius:30px;padding:2px 12px 2px 4px;font-weight:800;font-size:1.15rem;
  box-shadow:0 0 10px #2a6cff77;min-height:38px
}
.cn{
  width:28px;height:28px;border-radius:50%;background:radial-gradient(#ffe27a,#e0a300);
  border:2px solid #b87b00;display:inline-grid;place-items:center;font-size:.9rem;color:#8a5a00;
  font-style:normal
}
#coins.bump{animation:bp .5s}@keyframes bp{50%{transform:scale(1.25)}}
#hud{margin-left:auto;display:flex;align-items:center;gap:8px}
.user-pill{
  background:#0a1a44;border:2px solid var(--acc);padding:2px 10px 2px 4px;border-radius:24px;
  display:flex;align-items:center;gap:6px;font-size:0.88rem;font-weight:800;cursor:pointer
}
.user-pill .av-mini{width:26px;height:26px;border-radius:50%;overflow:hidden;flex-shrink:0;display:grid;place-items:center}
.user-pill .av-mini svg{width:100%;height:100%}

main{max-width:860px;margin:0 auto;padding:12px;padding-bottom:calc(24px + var(--safe-bottom))}
button{font:inherit;cursor:pointer;color:var(--tx)}
:focus-visible{outline:4px solid var(--yl);outline-offset:2px}

.tt{text-align:center;font-size:clamp(1.4rem,5.5vw,2.1rem);margin:8px 0;text-shadow:0 0 14px var(--acc)}
.stt{text-align:center;font-size:1rem;color:#9ec7f0;margin:-4px 0 12px 0}
.btn{
  background:linear-gradient(#2d9bff,#1262c9);border:0;border-bottom:5px solid #0a3a82;
  border-radius:30px;padding:10px 22px;font-weight:800;font-size:1.15rem;color:#fff;
  margin:4px;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  text-decoration:none;transition:transform .1s
}
.btn:active{transform:translateY(3px)}
.btn.pk{background:linear-gradient(#ff6fbd,#c71f7e);border-bottom-color:#7d1a4f}
.btn.gr{background:linear-gradient(#35e07a,#13a34f);border-bottom-color:#0b5a2f}
.btn.pu{background:linear-gradient(#be5aff,#7a1bbd);border-bottom-color:#480f73}
.btn.yl{background:linear-gradient(#ffd23f,#e5a600);border-bottom-color:#996f00;color:#2c1b00}
.btn:disabled{opacity:0.45;filter:grayscale(1);cursor:not-allowed}

.stage{
  position:relative;min-height:clamp(440px,70vh,580px);overflow:hidden;border-radius:24px;
  border:2.5px solid #1c3b7a;background:radial-gradient(ellipse at 50% 20%,#0e2154 0%,#060d26 80%);
  box-shadow:0 0 30px #19a7ff33;padding:16px;display:flex;flex-direction:column;align-items:center;justify-content:center
}
.lg{text-align:center;margin-bottom:16px}
.lg1{
  position:relative;display:inline-block;background:#ffd23f;color:#17203a;font-weight:800;
  font-size:clamp(1.8rem,7.5vw,3rem);line-height:1.1;padding:2px 18px;border-radius:8px;
  box-shadow:0 5px 0 #b8860b,0 0 20px #000a;transform:rotate(-2deg)
}
.lg1 b{color:#e0245e;font-size:1.15em}
.lg1 span{
  position:absolute;right:-14px;top:-12px;background:#19a7ff;color:#ffd23f;font-size:.38em;
  padding:1px 6px;border-radius:6px;transform:rotate(8deg)
}
.lg2{
  font-weight:800;font-style:italic;font-size:clamp(1rem,4.5vw,1.5rem);color:#d8eeff;
  text-shadow:0 2px 0 #0b2a66,0 0 14px #19a7ff;transform:rotate(-2deg);margin-top:6px
}

.mbs{display:flex;flex-direction:column;gap:10px;width:100%;max-width:280px;z-index:2}
.mb{
  display:flex;align-items:center;gap:12px;border:0;border-radius:30px;padding:10px 20px;
  font-weight:800;font-size:1.2rem;color:#fff;text-align:left;box-shadow:0 4px 0 #0008;
  transition:transform .1s
}
.mb:active{transform:translateY(3px)}
.mb i{width:36px;height:36px;border-radius:50%;background:#0b1530;display:grid;place-items:center;font-style:normal;flex-shrink:0}
.mb.g{background:linear-gradient(#35e07a,#13a34f);border-bottom:4px solid #094a24}
.mb.b{background:linear-gradient(#2d9bff,#1262c9);border-bottom:4px solid #083770}
.mb.o{background:linear-gradient(#ffaa2a,#e06b00);border-bottom:4px solid #783900}
.mb.p{background:linear-gradient(#c25fff,#8417c9);border-bottom:4px solid #4a0d70}

/* Selector de Edades */
.age-bar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0}
.age-btn{
  background:#09153a;border:2.5px solid #2b4582;border-radius:20px;padding:8px 14px;
  font-weight:800;font-size:0.95rem;color:#cfe5ff;display:flex;align-items:center;gap:6px;
  transition:all .15s
}
.age-btn.on{
  background:linear-gradient(#19a7ff,#0e5db8);border-color:#ffd23f;color:#fff;
  box-shadow:0 0 16px #19a7ff88;transform:scale(1.04)
}
.age-badge{
  display:inline-block;background:var(--yl);color:#1c1100;font-size:0.85rem;font-weight:800;
  padding:2px 10px;border-radius:12px;margin-bottom:6px
}

/* Tablero de Juego */
.game-container{
  background:#070f2b;border:3px solid #1a3c7c;border-radius:24px;padding:14px;
  box-shadow:0 0 24px #19a7ff22;margin-top:6px
}
.op-board{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:#050c26ee;border:3px solid var(--acc);border-radius:20px;
  padding:14px 20px;box-shadow:0 0 20px var(--acc),inset 0 0 20px #0009;
  min-height:180px;position:relative
}
.carries-row{display:flex;gap:12px;justify-content:flex-end;width:100%;max-width:280px;padding-right:8px;margin-bottom:4px}
.cy{
  width:34px;height:34px;border:2.5px dashed var(--pk);border-radius:50%;background:#140824;
  color:var(--pk);display:grid;place-items:center;font-weight:800;font-size:1.1rem;cursor:pointer;
  transition:all .15s
}
.cy.on{background:var(--pk);color:#fff;border-style:solid;box-shadow:0 0 12px var(--pk)}

.vertical-calc{
  display:grid;grid-template-columns:auto repeat(3,44px);gap:4px;font-size:2.6rem;font-weight:800;
  align-items:center;justify-items:center;line-height:1.1
}
.calc-sign{color:var(--pk);font-size:2.8rem;grid-column:1}
.col-h{font-size:0.75rem;font-weight:800;color:#6b8bbb;text-align:center;line-height:1}
.calc-line{grid-column:1/-1;height:5px;background:var(--acc);border-radius:3px;box-shadow:0 0 10px var(--acc);width:100%;margin:4px 0}

/* Casillas de Dígitos */
.slots-row{
  display:flex;gap:8px;justify-content:center;align-items:center;margin-top:4px
}
.digit-slot{
  width:46px;height:54px;border-radius:12px;background:#091845;border:3px solid #365da8;
  display:grid;place-items:center;font-size:2.2rem;font-weight:800;color:#fff;
  cursor:pointer;transition:all .15s;position:relative
}
.digit-slot.active-slot{
  border-color:var(--yl);box-shadow:0 0 16px var(--yl);background:#12296e;
  animation:slot-pulse 1s infinite alternate
}
@keyframes slot-pulse{0%{box-shadow:0 0 8px var(--yl)}100%{box-shadow:0 0 20px var(--yl),inset 0 0 8px var(--yl)}}
.digit-slot.right{border-color:var(--gr);background:#073b1f;color:var(--gr);box-shadow:0 0 18px var(--gr)}
.digit-slot.wrong{border-color:#ff3b5c;background:#440b18;color:#ff8598;animation:sh .4s}
@keyframes sh{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

.col-tag{position:absolute;bottom:-18px;font-size:0.65rem;color:#7e9ec9;font-weight:800}

/* Apoyo Visual para Infantil (3-4 y 4-5 años) */
.visual-toys{
  display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;
  margin:10px 0;background:#0c194488;padding:8px 16px;border-radius:16px;border:1.5px dashed #2b4b96
}
.toy-cluster{display:flex;gap:4px;align-items:center;background:#071030;padding:4px 8px;border-radius:10px}
.toy-emoji{font-size:1.8rem;filter:drop-shadow(0 2px 4px #0008)}
.toy-op{font-size:1.8rem;font-weight:800;color:var(--yl)}

/* Teclado Numérico en Pantalla */
.keypad{
  display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:320px;margin:14px auto 6px auto
}
.kp-btn{
  height:54px;border-radius:16px;border:0;border-bottom:4px solid #143570;
  background:linear-gradient(#1e468f,#102a5e);color:#fff;font-size:1.7rem;font-weight:800;
  display:grid;place-items:center;box-shadow:0 3px 6px #0006;transition:transform .08s
}
.kp-btn:active{transform:translateY(3px);border-bottom-width:1px}
.kp-btn.del{background:linear-gradient(#c23b3b,#821515);border-bottom-color:#4a0909;font-size:1.4rem}
.kp-btn.ok{background:linear-gradient(#2ecc71,#169e50);border-bottom-color:#0b5c2c;font-size:1.6rem}

/* Galería de Avatares */
.avatar-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:10px;margin:16px 0}
.av-card{
  background:#091438;border:3px solid #233c7a;border-radius:18px;padding:8px 4px;
  text-align:center;cursor:pointer;transition:all .15s
}
.av-card svg{width:60px;height:60px;border-radius:50%;display:block;margin:0 auto 4px auto}
.av-card span{display:block;font-size:0.75rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av-card.on{border-color:var(--acc);box-shadow:0 0 16px var(--acc);background:#102869;transform:scale(1.05)}

/* Perfiles */
.prof-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;margin:16px 0}
.prof-card{
  background:#0c1634;border:3px solid #2b3a6b;border-radius:20px;padding:12px 8px;text-align:center;
  cursor:pointer;transition:0.15s;position:relative
}
.prof-card:active{transform:scale(0.96);border-color:var(--acc)}
.prof-card svg{width:70px;height:70px;border-radius:50%;margin:0 auto 6px auto;display:block}
.prof-card b{display:block;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prof-card .age-tag{font-size:0.7rem;color:var(--yl);font-weight:800}
.prof-card .del{color:#ff4f70;font-size:0.78rem;margin-top:6px;text-decoration:underline;cursor:pointer}
.prof-card.add{border-style:dashed;display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:140px;color:var(--acc)}

/* Subniveles */
.sub-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0}
.sub-btn{
  aspect-ratio:1;border-radius:14px;border:3px solid #2b3a6b;background:#0a1330;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px;
  cursor:pointer;transition:transform .1s
}
.sub-btn.on{border-color:var(--acc);box-shadow:0 0 12px var(--acc)}
.sub-btn.lock{opacity:0.4;filter:grayscale(1);cursor:not-allowed}
.sub-btn b{font-size:1.15rem;line-height:1.1}
.sub-btn .sts{font-size:0.75rem;color:var(--yl)}

/* Modal de Celebración */
#modal-overlay{
  position:fixed;inset:0;background:#000c;backdrop-filter:blur(6px);z-index:100;
  display:grid;place-items:center;padding:16px;opacity:0;pointer-events:none;transition:0.3s
}
#modal-overlay.s{opacity:1;pointer-events:all}
.modal-box{
  background:#0c1634;border:4px solid var(--acc);border-radius:28px;padding:24px 20px;
  text-align:center;max-width:440px;width:100%;box-shadow:0 0 40px var(--acc);position:relative;overflow:hidden
}
.confetti{position:absolute;width:10px;height:10px;border-radius:2px;animation:cfall 3s linear infinite}
@keyframes cfall{0%{transform:translateY(-100px) rotate(0deg);opacity:1}100%{transform:translateY(500px) rotate(720deg);opacity:0}}

/* Tienda */
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin:12px 0}
.shop-card{
  background:#0a1330;border:3px solid #2a6cff;border-radius:18px;padding:8px;text-align:center;
  box-shadow:0 0 12px #2a6cff44
}
.shop-card svg{width:54px;height:54px;margin:0 auto 4px auto;display:block}
.shop-card b{display:block;font-size:0.95rem}
.shop-buy-btn{
  margin-top:6px;padding:4px 12px;border-radius:20px;font-weight:800;font-size:0.85rem;
  border:0;background:linear-gradient(#35e07a,#13a34f);color:#04301a;display:inline-flex;align-items:center;gap:4px
}
.shop-buy-btn.ow{background:#2a6cff;color:#fff}

#msg{
  position:fixed;top:calc(56px + var(--safe-top));left:50%;transform:translate(-50%,-20px);
  opacity:0;transition:.3s;background:#050c22ee;border:2.5px solid var(--gr);padding:8px 20px;
  border-radius:30px;z-index:90;font-weight:800;font-size:1.05rem;pointer-events:none;text-align:center;max-width:92vw
}
#msg.s{opacity:1;transform:translate(-50%,0)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:80}
.fo{animation:fo .7s}@keyframes fo{0%{box-shadow:inset 0 0 120px #39ff88}100%{box-shadow:inset 0 0 0 transparent}}
.fb{animation:fb .7s}@keyframes fb{0%{box-shadow:inset 0 0 120px #ff4fa3}100%{box-shadow:inset 0 0 0 transparent}}

.card{background:#0c1634;border:2.5px solid #2b3a6b;border-radius:20px;padding:16px;margin:10px 0;text-align:center}
.form-group{margin:12px 0;text-align:left}
.form-group label{display:block;margin-bottom:6px;font-weight:800;font-size:0.95rem}
input[type="text"]{
  width:100%;padding:12px 18px;border-radius:24px;border:3px solid #2b3a6b;
  background:#050a1c;color:#fff;font:inherit;font-weight:800;font-size:1.1rem
}
input[type="text"]:focus{border-color:var(--acc);outline:none}

#hand{
  position:fixed;left:0;top:0;width:52px;height:52px;transition:transform .4s cubic-bezier(0.18, 0.89, 0.32, 1.28);
  z-index:50;pointer-events:none;transform:translate(8px,calc(100vh - 68px));filter:drop-shadow(0 0 8px var(--acc))
}
</style>
</head>
<body>
<header>
  <button id="bk" hidden onclick="back()" aria-label="Volver">←</button>
  <div class="pill" id="coins" aria-live="polite"><i class="cn">$</i><b id="cv">0</b></div>
  <div id="hud"></div>
</header>
<div id="msg" role="status" aria-live="polite"></div>
<div id="fx"></div>
<main id="m"></main>
<div id="hand"></div>

<div id="modal-overlay">
  <div class="modal-box" id="modal-content"></div>
</div>

    name: "CatNap", color: "#7b1fa2",

  },

const $ = s => document.querySelector(s);
const R = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const pick = a => a[R(0, a.length-1)];

  },

    return P.find(p => p.id === A) || null;

/* ==========================================================================
   4. AUDIO SINTETIZADO (Web Audio API - 100% Local y Procedural)
   ========================================================================== */
let AC = null;
function beep(freq, dur = 0.12, type = "square") {
  if(!PM.cur || !PM.cur.snd) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if(AC.state === "suspended") AC.resume();
    const osc = AC.createOscillator();
    const gain = AC.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, AC.currentTime);
    gain.gain.setValueAtTime(0.05, AC.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + dur);
    osc.connect(gain);
    gain.connect(AC.destination);
    osc.start();
    osc.stop(AC.currentTime + dur);
  } catch(e) {}
}

/* ==========================================================================
   5. MOTOR DE GENERACIÓN ARITMÉTICA
   ========================================================================== */
const TOY_EMOJIS = ["🧸","⭐","🎈","🚗","🍎","🎁","🤖","🍩","🐱","🚀"];

function genMath(ageKey, subIndex) {
  const cfg = AGE_GROUPS[ageKey].subs[subIndex];
  let t = cfg.type === "mix" ? (Math.random() < 0.5 ? "+" : "-") : cfg.type;
  let a, b, r;
  let iters = 0;
  
  const aMin = cfg.aMin !== undefined ? cfg.aMin : (cfg.min !== undefined ? cfg.min : 1);
  const aMax = cfg.aMax !== undefined ? cfg.aMax : (cfg.max !== undefined ? cfg.max : 10);
  const bMin = cfg.bMin !== undefined ? cfg.bMin : 1;
  const bMax = cfg.bMax !== undefined ? cfg.bMax : (cfg.max !== undefined ? cfg.max : 9);
  
  do {
    iters++;
    if(iters > 10000) break;
    
    if(t === "count") {
      a = R(aMin, aMax);
      b = 0;
      r = a;
      const emoji = pick(TOY_EMOJIS);
      return { type: "count", a, b, r, ans: a, t: "conteo", emoji, isLittle: true };
    }
    
    if(t === "+") {
      a = R(aMin, aMax);
      b = R(bMin, bMax);
      r = a + b;
      if(cfg.maxRes && r > cfg.maxRes) continue;
      if(cfg.carry === 0 && (a % 10 + b % 10 >= 10 || Math.floor(a/10)%10 + Math.floor(b/10)%10 >= 10)) continue;
      if(cfg.carry === 1 && (a % 10 + b % 10 < 10)) continue;
      if(cfg.carry === 2 && (a % 10 + b % 10 < 10 || Math.floor(a/10)%10 + Math.floor(b/10)%10 < 10)) continue;
    } else {
      a = R(aMin, aMax);
      b = R(bMin, Math.min(a - 1, bMax));
      r = a - b;
      if(r < 0) continue;
      if(cfg.carry === 0 && (a % 10 < b % 10 || Math.floor(a/10)%10 < Math.floor(b/10)%10)) continue;
      if(cfg.carry === 1 && (a % 10 >= b % 10)) continue;
      if(cfg.carry === 2 && (a % 10 >= b % 10 || Math.floor(a/10)%10 >= Math.floor(b/10)%10)) continue;
    }
    if(r < 0 || r > 999) continue;
    break;
  } while(1);
  
  const isLittle = ageKey === "3-4" || ageKey === "4-5";
  const emoji = pick(TOY_EMOJIS);
  return { type: "op", t, a, b, r, ans: r, isLittle, emoji };
}

/* ==========================================================================
   7. LÓGICA DE JUEGO Y ESCRITURA DÍGITO A DÍGITO
   ========================================================================== */
function stop() {
  if(T) cancelAnimationFrame(T);
  if(G && G.to) clearTimeout(G.to);
}

function play(ageKey, subIndex) {
  stop();
  G = {
    ageKey,
    sub: subIndex,
    n: 0,
    e: 0,
    lock: 0,
    o: null,
    digits: [],
    curSlot: 0,
    carries: [0, 0]
  };
  nextQuestion(true);
}

function nextQuestion(first) {
  G.lock = 0;
  G.carries = [0, 0];
  G.o = genMath(G.ageKey, G.sub);
  
  const o = G.o;
  const ansStr = String(o.ans);
  const numDigits = ansStr.length;
  
  // Digits array: index 0 = Units (derecha), index 1 = Tens, index 2 = Hundreds
  G.digits = Array(numDigits).fill("");
  G.curSlot = 0; // Se empieza por las UNIDADES
  
  const cfg = AGE_GROUPS[G.ageKey].subs[G.sub];
  const hText = first ? cfg.desc : (o.type === "count" ? "¿Cuántos juguetes ves? Cuenta y escribe el número." : "Calcula escribiendo cada dígito:");
  
  const hud = `<div class="pill" aria-label="Progreso">${"⭐".repeat(G.n)}${"☆".repeat(5 - G.n)}</div>`;
  
  go("game", `<div class="game-container">
    <div class="hn" style="text-align:center;font-size:1.05rem;font-weight:800;color:var(--yl);margin-bottom:10px">${hText}</div>
    ${renderOperationBoard(o, numDigits)}
    ${renderKeypad()}
  </div>`, hud);
}

function renderOperationBoard(o, numDigits) {
  if(o.type === "count") {
    // Modo Conteo Infantil (3-4 años)
    const toysHTML = Array(o.a).fill(0).map(() => `<span class="toy-emoji">${o.emoji}</span>`).join(" ");
    return `<div class="op-board">
      <div class="visual-toys" style="margin-bottom:14px">${toysHTML}</div>
      <div style="font-size:1.1rem;font-weight:800;color:#bad4f5;margin-bottom:6px">Escribe el total:</div>
      <div class="slots-row">
        <div class="digit-slot active-slot" id="slot-0" onclick="selectSlot(0)">?</div>
      </div>
    </div>`;
  }
  
  // Modo Operación Aritmética
  let visualAid = "";
  if(o.isLittle) {
    const aToys = Array(o.a).fill(0).map(() => `<span class="toy-emoji">${o.emoji}</span>`).join("");
    const bToys = Array(o.b).fill(0).map(() => `<span class="toy-emoji">${o.emoji}</span>`).join("");
    visualAid = `<div class="visual-toys">
      <div class="toy-cluster">${aToys}</div>
      <span class="toy-op">${o.t}</span>
      <div class="toy-cluster">${bToys}</div>
    </div>`;
  }
  
  const carriesHTML = o.a >= 10 ? `<div class="carries-row">
    <button class="cy" id="cy-1" onclick="toggleCarry(1)" title="Llevada Decenas"></button>
    <button class="cy" id="cy-0" onclick="toggleCarry(0)" title="Llevada Unidades"></button>
  </div>` : "";
  
  // Formato Vertical con Columnas
  const aStr = String(o.a).padStart(numDigits, " ");
  const bStr = String(o.b).padStart(numDigits, " ");
  
  const aCols = aStr.split("").map(c => `<i>${c.trim()}</i>`).join("");
  const bCols = bStr.split("").map(c => `<i>${c.trim()}</i>`).join("");
  
  // Slots de respuesta generados de izquierda a derecha (Centenas, Decenas, Unidades)
  const slotDivs = [];
  for(let i = numDigits - 1; i >= 0; i--) {
    const isActive = (i === 0);
    const tag = i === 0 ? "U" : (i === 1 ? "D" : "C");
    slotDivs.push(`<div class="digit-slot ${isActive ? 'active-slot' : ''}" id="slot-${i}" onclick="selectSlot(${i})">
      <span id="slot-val-${i}"></span>
      <span class="col-tag">${tag}</span>
    </div>`);
  }
  
  return `<div class="op-board">
    ${carriesHTML}
    ${visualAid}
    <div class="vertical-calc" style="grid-template-columns:auto repeat(${numDigits},44px)">
      <span class="calc-sign"> </span>${aCols}
      <span class="calc-sign">${o.t}</span>${bCols}
      <div class="calc-line"></div>
    </div>
    <div class="slots-row">
      ${slotDivs.join("")}
    </div>
  </div>`;
}

function renderKeypad() {
  return `<div class="keypad">
    <button class="kp-btn" onclick="pressDigit(1)">1</button>
    <button class="kp-btn" onclick="pressDigit(2)">2</button>
    <button class="kp-btn" onclick="pressDigit(3)">3</button>
    <button class="kp-btn" onclick="pressDigit(4)">4</button>
    <button class="kp-btn" onclick="pressDigit(5)">5</button>
    <button class="kp-btn" onclick="pressDigit(6)">6</button>
    <button class="kp-btn" onclick="pressDigit(7)">7</button>
    <button class="kp-btn" onclick="pressDigit(8)">8</button>
    <button class="kp-btn" onclick="pressDigit(9)">9</button>
    <button class="kp-btn del" onclick="pressDel()" aria-label="Borrar">⌫</button>
    <button class="kp-btn" onclick="pressDigit(0)">0</button>
    <button class="kp-btn ok" onclick="submitCheck()" aria-label="Comprobar">✓</button>
  </div>`;
}

function toggleCarry(idx) {
  if(G.lock) return;
  G.carries[idx] = G.carries[idx] ? 0 : 1;
  const el = $(`#cy-${idx}`);
  if(el) {
    el.classList.toggle("on", !!G.carries[idx]);
    el.textContent = G.carries[idx] ? "1" : "";
  }
  clickSound();
}

function selectSlot(idx) {
  if(G.lock) return;
  G.curSlot = idx;
  updateSlotsVisual();
  clickSound();
}

function updateSlotsVisual() {
  const numDigits = String(G.o.ans).length;
  for(let i = 0; i < numDigits; i++) {
    const el = $(`#slot-${i}`);
    const vEl = $(`#slot-val-${i}`);
    if(el) {
      el.classList.toggle("active-slot", i === G.curSlot);
    }
    if(vEl) {
      vEl.textContent = G.digits[i] !== "" ? G.digits[i] : "";
    }
  }
}

function pressDigit(d) {
  if(G.lock) return;
  clickSound();
  
  const numDigits = String(G.o.ans).length;
  G.digits[G.curSlot] = d;
  
  const valEl = $(`#slot-val-${G.curSlot}`);
  if(valEl) valEl.textContent = d;
  else {
    const s0 = $(`#slot-0`);
    if(s0) s0.textContent = d;
  }
  
  // Avanzar a la siguiente columna hacia la izquierda (U -> D -> C)
  if(G.curSlot < numDigits - 1) {
    G.curSlot++;
    updateSlotsVisual();
  }
  
  // Si todas las casillas están completas, comprobar automáticamente tras un breve instante
  if(G.digits.every(v => v !== "")) {
    G.to = setTimeout(submitCheck, 320);
  }
}

function pressDel() {
  if(G.lock) return;
  clickSound();
  G.digits[G.curSlot] = "";
  const valEl = $(`#slot-val-${G.curSlot}`);
  if(valEl) valEl.textContent = "";
  else {
    const s0 = $(`#slot-0`);
    if(s0) s0.textContent = "?";
  }
  // Retroceder hacia la derecha si no está en unidades
  if(G.curSlot > 0) {
    G.curSlot--;
    updateSlotsVisual();
  }
}

function submitCheck() {
  if(G.lock) return;
  const numDigits = String(G.o.ans).length;
  
  // Convertir slots a número (slot 0 = unidades, slot 1 = decenas, etc.)
  const userNumStr = G.digits.slice().reverse().join("");
  if(userNumStr.length < numDigits || G.digits.some(v => v === "")) {
    say("¡Escribe todos los números de la operación!");
    return;
  }
  
  const userVal = parseInt(userNumStr, 10);
  G.lock = 1;
  
  // Animación del GrabPack hacia el resultado
  const hand = $("#hand");
  const targetSlot = $("#slot-0");
  if(hand && targetSlot) {
    const r = targetSlot.getBoundingClientRect();
    hand.style.transform = `translate(${r.left + r.width/2 - 24}px, ${r.top + r.height/2 - 24}px)`;
  }
  
  if(userVal === G.o.ans) {
    // ¡Acierto!
    ok();
    fx("fo");
    for(let i = 0; i < numDigits; i++) {
      const el = $(`#slot-${i}`);
      if(el) el.classList.add("right");
    }
    G.n++;
    say(pick(["¡Genial! 🌟", "¡Perfecto, crack de las mates! 💙", "¡Bien hecho! Poppy sonríe 🎀", "¡Eso es! ⚡"]));
    
    if(G.n >= 5) {
      G.to = setTimeout(() => endRound(true), 1100);
    } else {
      G.to = setTimeout(() => {
        if(hand) hand.style.transform = "";
        nextQuestion();
      }, 1200);
    }
  } else {
    // Fallo
    bad();
    fx("fb");
    for(let i = 0; i < numDigits; i++) {
      const el = $(`#slot-${i}`);
      if(el) el.classList.add("wrong");
    }
    
    // Pistas pedagógicas
    let hint = "¡Casi! Inténtalo otra vez 💪";
    if(numDigits > 1 && G.digits[0] !== (G.o.ans % 10)) {
      hint = "Mira primero las unidades 👀";
    } else if(G.o.t === "+" && G.o.a % 10 + G.o.b % 10 >= 10) {
      hint = "¡Recuerda sumar la llevada arriba! 💡";
    }
    say(hint);
    
    G.e++;
    setTimeout(() => {
      for(let i = 0; i < numDigits; i++) {
        const el = $(`#slot-${i}`);
        if(el) el.classList.remove("wrong");
      }
      G.digits = Array(numDigits).fill("");
      G.curSlot = 0;
      updateSlotsVisual();
      if(hand) hand.style.transform = "";
      G.lock = 0;
    }, 1100);
  }
}

// Soporte para teclado físico (Chromebook / PC / Teclados Bluetooth)
window.addEventListener("keydown", e => {
  if(scr !== "game" || !G || G.lock) return;
  if(e.key >= "0" && e.key <= "9") {
    pressDigit(parseInt(e.key, 10));
  } else if(e.key === "Backspace" || e.key === "Delete") {
    pressDel();
  } else if(e.key === "Enter") {
    submitCheck();
  }
});

/* Fin de Ronda y Celebración */
function endRound(win) {
  stop();
  const ageKey = G.ageKey;
  const sub = G.sub;
  
  if(win) {
    const stars = Math.max(1, 5 - G.e);
    if(!PM.cur.prog[ageKey]) PM.cur.prog[ageKey] = {};
    const prev = PM.cur.prog[ageKey][sub] || { stars: 0 };
    const coins = stars > prev.stars ? (stars - prev.stars) * 20 : 10;
    PM.cur.coins += coins;
    
    if(stars > prev.stars) PM.cur.prog[ageKey][sub] = { stars };
    PM.save();
    coinsUI();
    
    if(stars === 5) return celebrate(ageKey, sub);
    
    go("end", `<div class="card" style="padding:24px 16px">
      <div style="font-size:3.5rem">🏆</div>
      <h1 class="tt" style="color:var(--yl);margin:6px 0">¡Nivel Completado!</h1>
      <div style="font-size:2.2rem;margin:10px 0">${"⭐".repeat(stars)}</div>
      <div class="pill" style="display:inline-flex;margin:10px auto"><i class="cn">$</i>+${coins} Monedas</div>
      <p style="color:#bad4f5">¡Gran trabajo resolviendo las operaciones dígito a dígito!</p>
      <div style="margin-top:20px">
        <button class="btn gr" onclick="levelMap('${ageKey}')">Continuar</button>
      </div>
    </div>`);
  } else {
    go("end", `<div class="card">
      <div style="font-size:3.5rem">💡</div>
      <h1 class="tt">¡Casi lo logras!</h1>
      <p>Sigue practicando, ¡cada vez lo harás más rápido!</p>
      <button class="btn gr" onclick="play('${ageKey}', ${sub})">🔄 Reintentar</button>
      <button class="btn" onclick="levelMap('${ageKey}')">Niveles</button>
    </div>`);
  }
}

function celebrate(ageKey, sub) {
  const overlay = $("#modal-overlay");
  const content = $("#modal-content");
  content.innerHTML = `<h1 class="tt" style="color:var(--yl)">🎉 ¡ENHORABUENA ${PM.cur.name.toUpperCase()}! 🎉</h1>
  <p style="font-size:1.3rem">¡Has conseguido 5 Estrellas!</p>
  <div style="font-size:2.8rem;margin:16px 0">⭐⭐⭐⭐⭐</div>
  <p style="color:#bfe0ff">¡Eres un auténtico Maestro de la Fábrica de Mates!</p>
  <button class="btn gr" onclick="$('#modal-overlay').classList.remove('s'); levelMap('${ageKey}')">¡GENIAL!</button>`;
  
  // Confetti local
  for(let i = 0; i < 40; i++) {
    const c = document.createElement("div");
    c.className = "confetti";
    c.style.left = Math.random() * 100 + "%";
    c.style.background = pick(["#19a7ff","#ff3fa4","#ffd23f","#2dff7a","#b34bff"]);
    c.style.animationDelay = Math.random() * 2 + "s";
    content.appendChild(c);
  }
  
  overlay.classList.add("s");
  fanfare();
}

/* ==========================================================================
   8. PERFILES Y GESTIÓN DE AVATARES LOCALES
   ========================================================================== */
function loginView() {
  stop();
  go("login", `<h2 class="tt">¿Quién va a jugar?</h2>
  <div class="stt">Perfiles guardados en tu dispositivo</div>
  <div class="prof-grid">
    ${P.map(p => `<div class="prof-card" onclick="selectProfile('${p.id}')">
      ${getAvatarSVG(p.avatar)}
      <b>${p.name}</b>
      <div class="age-tag">${p.age || '7-8'} años</div>
      <div class="del" onclick="event.stopPropagation();if(confirm('¿Borrar a ${p.name}?')) PM.del('${p.id}')">Borrar</div>
    </div>`).join("")}
    <div class="prof-card add" onclick="createProfileView()">
      <div style="font-size:3rem;line-height:1">+</div>
      <b>Nuevo Jugador</b>
    </div>
  </div>
  <div style="text-align:center;margin-top:14px">
    ${P.length ? '<button class="btn" onclick="title()">VOLVER</button>' : ''}
  </div>`);
}

function selectProfile(id) {
  A = id;
  PM.save();
  ok();
  title();
}

function createProfileView() {
  window.tempAvatar = "hug";
  window.tempAge = "7-8";
  
  const avList = Object.keys(AVATARS).map(k => {
    return `<div class="av-card ${k === 'hug' ? 'on' : ''}" data-av="${k}" onclick="setSelAvatar(this, '${k}')">
      ${getAvatarSVG(k)}
      <span>${AVATARS[k].name}</span>
    </div>`;
  }).join("");
  
  go("create", `<h2 class="tt">Nuevo Jugador</h2>
  <div class="card" style="text-align:left">
    <div class="form-group">
      <label>Escribe tu nombre:</label>
      <input type="text" id="pname" placeholder="Tu nombre..." maxlength="12" autofocus>
    </div>
    
    <div class="form-group">
      <label>Elige tu personaje favorito (100% Offline):</label>
      <div class="avatar-grid">${avList}</div>
    </div>
    
    <div class="form-group">
      <label>Elige tu edad:</label>
      <div class="age-bar" style="justify-content:flex-start">
        ${Object.keys(AGE_GROUPS).map(k => `
          <button type="button" class="age-btn ${k==='7-8'?'on':''}" onclick="setSelAge(this, '${k}')">
            ${AGE_GROUPS[k].tag} (${AGE_GROUPS[k].name})
          </button>
        `).join("")}
      </div>
    </div>
    
    <div style="text-align:center;margin-top:20px">
      <button class="btn gr" onclick="confirmCreate()">¡LISTO PARA JUGAR!</button>
      ${P.length ? '<button class="btn" onclick="loginView()">VOLVER</button>' : ''}
    </div>
  </div>`);
}

function setSelAvatar(el, avId) {
  document.querySelectorAll(".av-card").forEach(c => c.classList.remove("on"));
  el.classList.add("on");
  window.tempAvatar = avId;
  clickSound();
}

function setSelAge(el, ageKey) {
  document.querySelectorAll(".age-btn").forEach(c => c.classList.remove("on"));
  el.classList.add("on");
  window.tempAge = ageKey;
  clickSound();
}

function confirmCreate() {
  const name = $("#pname").value.trim();
  if(!name) return say("¡Escribe tu nombre primero!");
  PM.create(name, window.tempAvatar || "hug", window.tempAge || "7-8");
  ok();
  title();
}

/* ==========================================================================
   9. TIENDA DE JUGUETES Y PERSONALIZACIÓN
   ========================================================================== */
const ITEMS = [
  { id: "h_blue", n: "Mano Azul GrabPack", c: 0, k: "h", col: "#19a7ff" },
  { id: "h_gold", n: "Mano Dorada", c: 50, k: "h", col: "#ffd23f" },
  { id: "h_neon", n: "Guante Neón", c: 60, k: "h", col: "#2dff7a" },
  { id: "h_pink", n: "Mano Kissy Rosa", c: 50, k: "h", col: "#ff3fa4" },
  { id: "h_purp", n: "Mano CatNap Morada", c: 75, k: "h", col: "#b34bff" }
];

function shop() {
  stop();
  if(!PM.cur) return loginView();
  if(!PM.cur.own) PM.cur.own = ["h_blue"];
  
  go("shop", `<h2 class="tt">Tienda Playtime Co.</h2>
  <div class="stt">Usa tus Monedas Playtime para personalizar tu GrabPack</div>
  
  <div class="card">
    <h3 style="color:var(--yl);margin:0 0 10px 0">Manos del GrabPack</h3>
    <div class="shop-grid">
      ${ITEMS.map(it => {
        const isOwned = PM.cur.own.includes(it.id);
        const isEquipped = PM.cur.hand === it.col;
        return `<div class="shop-card">
          <div style="height:60px">${HAND_SVG(it.col)}</div>
          <b>${it.n}</b>
          <button class="shop-buy-btn ${isOwned ? 'ow' : ''}" onclick="buyItem('${it.id}')">
            ${isEquipped ? '✔ Equipado' : (isOwned ? 'Poner' : `<i class="cn">$</i>${it.c}`)}
          </button>
        </div>`;
      }).join("")}
    </div>
    <div style="margin-top:16px">
      <button class="btn" onclick="title()">VOLVER</button>
    </div>
  </div>`);
}

function buyItem(id) {
  const item = ITEMS.find(x => x.id === id);
  if(!item) return;
  if(!PM.cur.own.includes(id)) {
    if(PM.cur.coins < item.c) return say("¡Te faltan monedas! Resuelve más operaciones 💪");
    PM.cur.coins -= item.c;
    PM.cur.own.push(id);
    ok();
    say("¡Accesorio desbloqueado! 🎉");
  } else {
    clickSound();
  }
  PM.cur.hand = item.col;
  PM.save();
  coinsUI();
  $("#hand").innerHTML = HAND_SVG(PM.cur.hand);
  shop();
}

function back() {
  stop();
  if(scr === "game" || scr === "end") levelMap(PM.cur ? PM.cur.age : "7-8");
  else title();
}

// Service Worker Offline
if('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

load();
