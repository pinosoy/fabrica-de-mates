<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Playtime Co. · Fábrica de Mates</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--acc:#19a7ff;--yl:#ffd23f;--gr:#2dff7a;--pk:#ff3fa4;--tx:#eaf6ff;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100%;font-family:'Baloo 2','Trebuchet MS',system-ui,sans-serif;color:var(--tx);background:linear-gradient(#050a1cd0,#050a1cf2),var(--fact) center/cover fixed #050a1c;overflow-x:hidden}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:8px 12px;background:#050a1cdd;border-bottom:2px solid #16306b}
#bk{width:42px;height:42px;border-radius:50%;border:3px solid #19a7ff;background:#0a1a44;color:#fff;font-size:1.4rem;box-shadow:0 0 12px #19a7ff;display:grid;place-items:center;padding:0}
#bk[hidden]{display:none}
.pill{display:flex;align-items:center;gap:8px;background:#071030;border:3px solid #2a6cff;border-radius:30px;padding:2px 14px 2px 4px;font-weight:800;font-size:1.3rem;box-shadow:0 0 12px #2a6cff77;min-height:42px}
.hrt{padding-left:14px;border-color:#ff3b5c;box-shadow:0 0 12px #ff3b5c88}
.cn{width:30px;height:30px;border-radius:50%;background:radial-gradient(#ffe27a,#e0a300);border:2px solid #b87b00;display:inline-grid;place-items:center;font-size:.95rem;color:#8a5a00;font-style:normal}
#coins.bump{animation:bp .5s}@keyframes bp{50%{transform:scale(1.25)}}
#hud{margin-left:auto}
main{max-width:880px;margin:0 auto;padding:12px}
button{font:inherit;cursor:pointer;color:var(--tx)}
:focus-visible{outline:4px solid var(--yl);outline-offset:2px}
.tt{text-align:center;font-size:clamp(1.5rem,6vw,2.2rem);margin:8px 0;text-shadow:0 0 14px #19a7ff}
.btn{background:linear-gradient(#2d9bff,#1262c9);border:0;border-bottom:5px solid #0a3a82;border-radius:30px;padding:8px 24px;font-weight:800;font-size:1.15rem;color:#fff;margin:4px}
.btn:active{transform:translateY(3px)}.btn.pk{background:linear-gradient(#ff6fbd,#c71f7e);border-bottom-color:#7d1a4f}.btn.gr{background:linear-gradient(#35e07a,#13a34f);border-bottom-color:#0b5a2f}
.stage{position:relative;min-height:clamp(430px,72vh,580px);overflow:hidden;border-radius:20px;border:2px solid #1c3b7a;background:#070c1f;box-shadow:0 0 30px #19a7ff44}
.stage .hero{position:absolute;right:0;bottom:0;height:86%;max-width:100%;-webkit-mask-image:linear-gradient(to left,#000 60%,transparent);mask-image:linear-gradient(to left,#000 60%,transparent)}
.ld .hero{left:0;right:auto;height:100%;-webkit-mask-image:linear-gradient(to right,#000 55%,transparent);mask-image:linear-gradient(to right,#000 55%,transparent)}
.lgw{position:absolute;left:18px;top:26px;z-index:2}
.lg1{position:relative;display:inline-block;background:#ffd23f;color:#17203a;font-weight:800;font-size:clamp(2rem,9vw,3.4rem);line-height:1.1;padding:0 16px;border-radius:6px;box-shadow:0 5px 0 #b8860b,0 0 24px #000a;transform:rotate(-3deg)}
.lg1 b{color:#e0245e;font-size:1.2em}.lg1 span{position:absolute;right:-16px;top:-14px;background:#19a7ff;color:#ffd23f;font-size:.36em;padding:0 8px;border-radius:6px;transform:rotate(8deg)}
.lg2{font-weight:800;font-style:italic;font-size:clamp(1.05rem,5vw,1.7rem);color:#d8eeff;text-shadow:0 3px 0 #0b2a66,0 0 14px #19a7ff;transform:rotate(-3deg);margin:6px 0 0 6px}
.mbs{position:absolute;left:16px;bottom:18px;display:flex;flex-direction:column;gap:12px;z-index:2}
.mb{display:flex;align-items:center;gap:10px;border:0;border-radius:30px;padding:7px 22px 7px 7px;font-weight:800;font-size:1.25rem;color:#fff;width:200px;text-align:left;box-shadow:0 4px 0 #0008}
.mb i{width:36px;height:36px;border-radius:50%;background:#0b1530;display:grid;place-items:center;font-style:normal}
.mb.g{background:linear-gradient(#35e07a,#13a34f)}.mb.b{background:linear-gradient(#2d9bff,#1262c9)}.mb.o{background:linear-gradient(#ffc43a,#f08a10);color:#4a2500}
.lbar{position:absolute;right:5%;bottom:14%;width:min(46%,320px);text-align:center;font-weight:800;font-size:1.3rem}
.lbar div{height:16px;border-radius:10px;background:#0a1a44;border:2px solid #2a6cff;overflow:hidden;margin-top:6px}.lbar i{display:block;height:100%;width:0;background:linear-gradient(#35c0ff,#1262c9);transition:width 1.5s linear}
.lvs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.lvc{position:relative;padding:0;border-radius:16px;overflow:hidden;border:3px solid var(--c);background:#0a1330;box-shadow:0 0 16px var(--c);text-align:center}
.k0{--c:#2a82ff;--d:#1448b8}.k1{--c:#ff3fa4;--d:#b01270}.k2{--c:#ffb020;--d:#c26b00}
.lvc .pt{aspect-ratio:1;overflow:hidden}.lvc img{width:100%;height:100%;object-fit:cover;display:block}
.lvc .lb{background:linear-gradient(var(--c),var(--d));padding:6px 4px 10px}
.lvc b{display:block;font-size:clamp(.95rem,3.8vw,1.25rem);line-height:1.1}.lvc span{font-size:clamp(.7rem,3vw,1rem);font-weight:800}
.lvc u{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:#fffe;color:var(--d);text-decoration:none;font-size:1.3rem;margin:4px auto 0;line-height:1;font-weight:800}
.lvc:disabled{filter:grayscale(.8) brightness(.55);cursor:not-allowed}
.lk{position:absolute;inset:0 0 40% 0;display:grid;place-items:center;font-size:2.4rem}
.okb{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;background:var(--gr);color:#052;display:grid;place-items:center;font-weight:800}
.path{display:flex;align-items:center;justify-content:center;margin:16px 0}
.path i{width:40px;height:40px;border-radius:50%;border:3px solid #2a6cff;background:#0a1a44;display:grid;place-items:center;font-style:normal}
.path i.d{border-color:var(--gr);background:#073a22}.path u{width:clamp(18px,8vw,60px);border-top:3px dashed #2a6cff}
.gm{display:grid;grid-template-columns:clamp(105px,30%,260px) 1fr;grid-template-areas:"ch hn" "ch eq" "bt bt";gap:8px 10px;margin-top:6px}
.th0{--acc:#19a7ff}.th1{--acc:#ff3fa4}.th2{--acc:#ffb020}
.chimg{grid-area:ch;position:relative;min-height:190px}
.chimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top;-webkit-mask-image:radial-gradient(ellipse at 50% 42%,#000 48%,transparent 76%);mask-image:radial-gradient(ellipse at 50% 42%,#000 48%,transparent 76%)}
.hn{grid-area:hn;text-align:center;font-size:.95rem;color:#c8dcf0;background:#050c26aa;border-radius:12px;padding:6px 10px;align-self:start}.hn small{color:#ffd23f}
.op{grid-area:eq;align-self:start;justify-self:center;display:grid;grid-template-columns:repeat(4,1.2em);justify-content:center;align-items:center;font-size:clamp(2rem,8.5vw,3.8rem);font-weight:800;line-height:1.15;background:#050c26ee;border:3px solid var(--acc);box-shadow:0 0 18px var(--acc),inset 0 0 18px #0008;border-radius:16px;padding:8px 14px}
.op i{font-style:normal;text-align:center}
.cy{font-size:.4em;width:1.6em;height:1.6em;border:3px dashed var(--pk);border-radius:50%;background:none;color:var(--pk);justify-self:center;padding:0;font-weight:800}
.ln{grid-column:1/-1;height:6px;background:var(--acc);border-radius:3px;box-shadow:0 0 10px var(--acc);margin:2px 0}
.sg{color:var(--pk)}.q{grid-column:span 3;color:var(--yl);animation:pl 1.2s infinite}@keyframes pl{50%{opacity:.4}}
.opts{grid-area:bt;display:flex;gap:10px;justify-content:center}
.ch{flex:1;max-width:220px;font-size:clamp(1.6rem,7vw,2.6rem);font-weight:800;padding:6px;border-radius:14px;background:#050c26ee;border:3px solid var(--acc);box-shadow:0 0 14px var(--acc);color:#fff}
.ch.right{background:#0b7a3a;border-color:var(--gr);box-shadow:0 0 18px var(--gr)}.ch.wrong,.bx.wrong{filter:grayscale(1) brightness(.5)}.ch:disabled{opacity:.45}
.shake{animation:sh .4s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.belt{grid-area:bt;position:relative;aspect-ratio:4.2/1;overflow:hidden;border-radius:12px;border-top:8px solid #c1272d;border-bottom:8px solid #1c4fd0;background:repeating-linear-gradient(90deg,#2a3150 0 18px,#1d2340 18px 36px)}
.bx{position:absolute;top:10%;width:26%;aspect-ratio:1.33;background:var(--box) center/100% 100% no-repeat;border:0;padding:0;filter:drop-shadow(0 4px 4px #000a)}
.bx b{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#050c26ee;border:2px solid var(--acc);border-radius:10px;padding:0 10px;font-size:clamp(1.1rem,5vw,2rem);color:#fff}
.bx.right{outline:4px solid var(--gr)}
#hand{position:fixed;left:0;top:0;width:48px;height:48px;transition:transform .4s;z-index:4;pointer-events:none;transform:translate(8px,calc(100vh - 64px));filter:drop-shadow(0 0 6px #19a7ff)}
.ic{width:48px;height:48px}
.win{display:grid;grid-template-columns:1fr 2fr 1fr;align-items:center;gap:6px;margin-top:10px;text-align:center}
.win img{width:100%;border-radius:16px;-webkit-mask-image:radial-gradient(ellipse,#000 52%,transparent 78%);mask-image:radial-gradient(ellipse,#000 52%,transparent 78%)}
.vt{font-size:clamp(1.8rem,7vw,3.2rem);margin:0;color:var(--yl);-webkit-text-stroke:2px #0b2a66;paint-order:stroke fill;text-shadow:0 4px 0 #0b2a66,0 0 22px #19a7ff;line-height:1.05}
.mg{background:#050c26ee;border:3px solid #2a6cff;border-radius:18px;padding:10px;margin-top:10px;box-shadow:0 0 16px #2a6cff77}
.tro{font-size:4rem;animation:pl 1.5s infinite}
.shg{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:10px 0}
.sc{background:#0a1330;border:3px solid #2a6cff;border-radius:16px;padding:6px;text-align:center;box-shadow:0 0 12px #2a6cff66}
.sc img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}.sc b{display:block}
.pr{display:inline-flex;align-items:center;gap:6px;margin-top:4px;background:linear-gradient(#35e07a,#13a34f);border-radius:20px;padding:2px 14px 2px 4px;font-weight:800;color:#04301a}.pr.ow{background:#2a6cff;color:#fff;padding:2px 14px}
.card{background:#0c1634;border:2px solid #2b3a6b;border-radius:16px;padding:10px;margin:8px 0;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.it{margin:0}.it.on{border-color:var(--gr);box-shadow:0 0 12px var(--gr)}
.pack{display:flex;justify-content:center;align-items:center;gap:12px;margin:8px}
.hd{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:#0b1530;border:3px solid #fff8}.hd .ic{width:40px;height:40px}
.bp{background:#0008;border:2px dashed var(--pk);border-radius:14px;padding:8px 14px;font-size:1.6rem;min-width:90px}
.big{font-size:2rem;font-weight:800}
#msg{position:fixed;top:calc(64px + env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,-20px);opacity:0;transition:.3s;background:#000d;border:2px solid var(--gr);padding:6px 18px;border-radius:30px;z-index:9;font-weight:800;pointer-events:none;text-align:center;max-width:94vw}
#msg.s{opacity:1;transform:translate(-50%,0)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:8}
.fo{animation:fo .7s}@keyframes fo{0%{box-shadow:inset 0 0 140px #39ff88}100%{box-shadow:inset 0 0 0 #39ff8800}}
.fb{animation:fb .7s}@keyframes fb{0%{box-shadow:inset 0 0 140px #ff4fa3}100%{box-shadow:inset 0 0 0 #ff4fa300}}
@media(max-width:520px){.stage .hero{height:72%}.mb{width:170px;font-size:1.1rem}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style></head><body>

<div id="msg" role="status" aria-live="polite"></div><div id="fx"></div>
<main id="m"></main>

go("game",`<div class="gm th${g.l}"><div class="chimg"><img src="${IM[l.ch]}" alt=""></div><div class="hn">${h}<br><small>${tip}</small></div>${opHTML(o)}${body}</div>${g.l==0?`<div id="hand">${HAND(S.hand)}</div>`:""}`,hud);
if(g.l==1)runBelt()}
function runBelt(){const t0=performance.now(),bs=[...document.querySelectorAll(".bx")];
const f=t=>{const p=(t-t0)/18000;bs.forEach((b,i)=>b.style.left=i*30+p*40+"%");
if(p>=1){G.lock=1;bad();fx("fb");say("⏰ ¡Una caja se cayó! Más rápido la próxima.");G.e++;G.to=setTimeout(()=>G.e>2?end(0):next(),1300)}else T=requestAnimationFrame(f)};T=requestAnimationFrame(f)}
function ans(b,v){if(G.lock)return;G.lock=1;if(G.l==1)cancelAnimationFrame(T);
const fin=()=>v==G.o.ans?good(b):wrong(b),h=$("#hand");
if(h){const r=b.getBoundingClientRect();h.style.transform=`translate(${r.left+r.width/2-24}px,${r.top+r.height/2-24}px)`;G.to=setTimeout(fin,450)}else fin()}
function good(b){ok();fx("fo");b.classList.add("right");G.n++;say(pick(OKM));
if(G.n>=5)G.to=setTimeout(()=>end(1),1000);else G.to=setTimeout(next,1100)}
function wrong(b){bad();fx("fb");say(pick(BM));b.classList.add("shake","wrong");
if(G.l==1){G.e++;G.to=setTimeout(()=>G.e>2?end(0):next(),1200)}
else{b.disabled=true;G.lock=0;const h=$("#hand");if(h)h.style.transform=""}}
function end(win){stop();const l=LV[G.l],i=G.l;
if(win){const f=!S.done[i],r=f?l.r:20;S.done[i]=1;S.coins+=r;save();coinsUI();ok();
go("end",`<div class="win"><img src="${IM.popC}" alt=""><div>${i==2?'<div class="tro">🏆</div>':""}<h1 class="vt">¡Nivel completado!</h1><div class="pill big" style="display:inline-flex;margin:8px"><i class="cn">$</i>+${r}</div>${f?"":"<br><small>(Al repetir ganas 20 monedas de práctica)</small>"}</div><img src="${IM[["hugC","kisC","hugC"][i]]}" alt=""></div><div class="mg" style="text-align:center">${l.w}<br><button class="btn" onclick="${i<2?`play(${i+1})`:"levels()"}">${i<2?"Continuar":"Volver a los niveles"}</button><button class="btn pk" onclick="shop()">🧸 Tienda</button></div>`)}
else go("end",`<div class="win" style="grid-template-columns:1fr 2fr"><img src="${IM.load}" alt=""><div><h1 class="vt">¡Huggy te dio un abrazo!</h1><p>No pasa nada: practicar es de valientes. ¡Inténtalo otra vez!</p></div></div><div class="mg" style="text-align:center"><button class="btn gr" onclick="play(${i})">🔄 Reintentar</button><button class="btn" onclick="levels()">Niveles</button></div>`)}
coinsUI();load();
</script></body></html>
